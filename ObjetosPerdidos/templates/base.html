<!doctype html>
<html lang="es">
    <head>
        <title>{% block titulo %} {% endblock %} | Objetos Perdidos</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

        <style>
            form input[type=text], form input[type=number], form input[type=email],
            form input[type=file], form select, form textarea {
                display: block;
                width: 100%;
                padding: .375rem .75rem;
                border: 1px solid #ced4da;
                border-radius: .375rem;
            }
            .errorlist {
                color: #dc3545;
                list-style: none;
                padding-left: 0;
                margin: .25rem 0 0;
                font-size: .9rem;
            }
            .foto-tabla {
                width: 80px;
                height: 80px;
                object-fit: cover;
            }
        </style>
    </head>

    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">
                    <i class="bi bi-bus-front"></i> Terminal Cordillera Azul
                </a>
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
                    <a class="nav-link" href="{% url 'objetos' %}">Objetos encontrados</a>
                    <a class="nav-link" href="{% url 'crear' %}">Registrar objeto</a>
                    <a class="nav-link" href="{% url 'nosotros' %}">Nosotros</a>
                    <a class="nav-link" href="/admin/">Admin</a>
                </div>
            </div>
        </nav>

        <div class="container my-4">
            <div class="row">
                <div class="col-12">
                    {% block contenido %} {% endblock %}
                </div>
            </div>
        </div>

        <footer class="text-center text-muted small py-3 border-top">
            Oficina de Objetos Perdidos | Terminal de Buses Cordillera Azul | Av. Los Aromos 1450, Rancagua | objetosperdidos@cordilleraazul.cl
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
