{% extends "base.html" %}

{% block titulo %} Editar objeto {% endblock %}

{% block contenido %}

<div class="card shadow-sm">
    <div class="card-header bg-warning">
        <h4 class="mb-0">Editar objeto N° {{ objeto.id }}</h4>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-3 mb-3">
                <p class="fw-semibold">Fotografia actual</p>
                <img src="{{ objeto.imagen.url }}" class="img-fluid rounded border" alt="{{ objeto.nombre }}">
            </div>
            <div class="col-md-9">
                {% include 'objetos/form.html' %}
            </div>
        </div>
    </div>
</div>

{% endblock %}
