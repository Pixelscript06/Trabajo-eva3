{% extends "base.html" %}

{% block titulo %} Eliminar objeto {% endblock %}

{% block contenido %}

<div class="card shadow-sm border-danger">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Eliminar objeto</h4>
    </div>
    <div class="card-body">
        <div class="row align-items-center">
            <div class="col-md-3 mb-3">
                <img src="{{ objeto.imagen.url }}" class="img-fluid rounded border" alt="{{ objeto.nombre }}">
            </div>
            <div class="col-md-9">
                <p class="fs-5">¿Esta seguro de eliminar <strong>{{ objeto.nombre }}</strong>?</p>
                <p class="text-muted">Se borrara el registro y su fotografia. Esta accion no se puede deshacer.</p>

                <form method="post">
                    {% csrf_token %}
                    <input class="btn btn-danger" type="submit" value="Si, eliminar">
                    <a class="btn btn-primary" href="{% url 'objetos' %}" role="button">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
